apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: booktracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harii55/devsecops-project.git
    targetRevision: main
    path: helm/booktracker
  destination:
    server: https://kubernetes.default.svc
    namespace: booktracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
